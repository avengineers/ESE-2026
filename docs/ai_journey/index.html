<!doctype html>
<html lang="de">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <title>„Frag doch den Agenten!" – Wie agentische KI unseren Embedded-Entwicklungsalltag verändert hat</title>

  <link rel="stylesheet" href="../../reveal.js/dist/reset.css" />
  <link rel="stylesheet" href="../../reveal.js/dist/reveal.css" />
  <link rel="stylesheet" href="../../css/marquardt.css" />
  <link rel="stylesheet" href="../../css/custom.css" />

  <!-- Theme used for syntax highlighted code -->
  <link rel="stylesheet" href="../../reveal.js/dist/plugin/highlight/monokai.css" />
</head>

<body>
  <div class="reveal">
    <div class="slides">
      <!-- The agent of the live demo reads user_story.md alone, so the user story is a file and a
           section of its own, between the title slide and the rest of the deck. -->
      <section data-markdown="title.md">
      </section>
      <section data-markdown="user_story.md">
      </section>
      <section data-markdown="index.md" data-separator="^\r?\n---\r?\n$" data-separator-vertical="^\r?\n--\r?\n$">
      </section>
    </div>
  </div>

  <script src="../../reveal.js/dist/reveal.js"></script>
  <script src="../../reveal.js/dist/plugin/notes.js"></script>
  <script src="../../reveal.js/dist/plugin/markdown.js"></script>
  <script src="../../reveal.js/dist/plugin/highlight.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js-mermaid-plugin@11.4.1/plugin/mermaid/mermaid.min.js"></script>
  <script>
    // More info about initialization & config:
    // - https://revealjs.com/initialization/
    // - https://revealjs.com/config/
    Reveal.initialize({
      hash: true,
      slideNumber: "c/t",
      pdfSeparateFragments: false,
      pdfMaxPagesPerSlide: 1,
      backgroundTransition: "slide",
      // Learn about plugins: https://revealjs.com/plugins/
      plugins: [RevealMarkdown, RevealHighlight, RevealNotes, RevealMermaid],
    });

    // Give each <pre class="copyable"> a copy button, so the prompt of the live demo can be
    // pasted into the terminal. The look is in css/custom.css.
    Reveal.on("ready", () => {
      document.querySelectorAll("pre.copyable").forEach((pre) => {
        pre.classList.add("code-wrapper");
        const button = document.createElement("button");
        button.className = "copy-code-btn";
        button.textContent = "Copy";
        button.addEventListener("click", async () => {
          await navigator.clipboard.writeText(pre.querySelector("code").innerText);
          button.textContent = "Copied";
          button.classList.add("copied");
          setTimeout(() => {
            button.textContent = "Copy";
            button.classList.remove("copied");
          }, 2000);
        });
        pre.appendChild(button);
      });
    });

    // Draw each <svg class="slide-arrow"> as an arrow from the element named by data-arrow-from to
    // the one named by data-arrow-to, both on the same slide. Mermaid renders after the slides
    // are ready, so the arrow is drawn once both elements exist, and again on every resize.
    function drawArrow(svg) {
      const slide = svg.closest("section");
      const from = slide.querySelector(svg.dataset.arrowFrom);
      const to = slide.querySelector(svg.dataset.arrowTo);
      if (!from || !to || to.getBoundingClientRect().width === 0) {
        return false;
      }
      const scale = Reveal.getScale();
      const origin = slide.getBoundingClientRect();
      const a = from.getBoundingClientRect();
      const b = to.getBoundingClientRect();
      const x1 = (a.right - origin.left) / scale + 8;
      const y1 = (a.top + a.height / 2 - origin.top) / scale;
      const x2 = (b.left - origin.left) / scale - 8;
      const y2 = (b.top + b.height / 2 - origin.top) / scale;
      svg.innerHTML =
        '<defs><marker id="arrow-head" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">' +
        '<path d="M0,0 L10,4 L0,8 Z" fill="#ffffff"/></marker></defs>' +
        `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#ffffff" stroke-width="3" marker-end="url(#arrow-head)"/>`;
      return true;
    }

    // Mermaid sizes a gitGraph for labels rotated by 45 degrees. css/custom.css sets them level,
    // so the frame is too tall and too narrow: fit it to what is drawn.
    function fitGitGraph(graph) {
      const box = graph.getBBox();
      const pad = 8;
      graph.setAttribute(
        "viewBox",
        `${box.x - pad} ${box.y - pad} ${box.width + 2 * pad} ${box.height + 2 * pad}`,
      );
    }

    function drawArrows() {
      document.querySelectorAll("svg.slide-arrow").forEach((svg) => {
        let tries = 0;
        const attempt = () => {
          if (!drawArrow(svg)) {
            if (tries++ < 100) {
              setTimeout(attempt, 100);
            }
          } else if (!svg.dataset.centered) {
            // The diagram rendered after reveal.js centred the slide: fit it, centre the slide
            // again, and draw the arrow in its new place.
            svg.dataset.centered = "true";
            svg.closest("section").querySelectorAll(".git-graph svg").forEach(fitGitGraph);
            Reveal.layout();
            drawArrow(svg);
          }
        };
        attempt();
      });
    }

    Reveal.on("ready", drawArrows);
    Reveal.on("slidechanged", drawArrows);
    Reveal.on("resize", drawArrows);
  </script>
</body>

</html>
