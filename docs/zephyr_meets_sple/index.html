<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <title>There Is More to a Product Line Than Zephyr Boards</title>

  <link rel="stylesheet" href="../../reveal.js/dist/reset.css" />
  <link rel="stylesheet" href="../../reveal.js/dist/reveal.css" />
  <link rel="stylesheet" href="../../css/marquardt.css" />
  <link rel="stylesheet" href="../../css/custom.css" />
  <link rel="stylesheet" href="deck.css" />

  <!-- Theme used for syntax highlighted code -->
  <link rel="stylesheet" href="../../reveal.js/dist/plugin/highlight/monokai.css" />
</head>

<body>
  <div class="reveal">
    <div class="slides">
      <section data-markdown="index.md" data-separator="^\r?\n---\r?\n$" data-separator-vertical="^\r?\n--\r?\n$">
      </section>
    </div>
  </div>

  <script src="../../reveal.js/dist/reveal.js"></script>
  <script src="../../reveal.js/dist/plugin/notes.js"></script>
  <script src="../../reveal.js/dist/plugin/markdown.js"></script>
  <script src="../../reveal.js/dist/plugin/highlight.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js-mermaid-plugin@11.4.1/plugin/mermaid/mermaid.min.js"></script>
  <script>
    // More info about initialization & config:
    // - https://revealjs.com/initialization/
    // - https://revealjs.com/config/
    Reveal.initialize({
      hash: true,
      slideNumber: "c/t",
      pdfSeparateFragments: false,
      pdfMaxPagesPerSlide: 1,
      backgroundTransition: "slide",
      // Learn about plugins: https://revealjs.com/plugins/
      plugins: [RevealMarkdown, RevealHighlight, RevealNotes, RevealMermaid],
    });

    // Each item on the thread rail jumps to the thread slide of its chapter.
    // A thread slide belongs to the chapter whose item is marked "now".
    Reveal.on("ready", () => {
      const threads = [...document.querySelectorAll(".reveal .slides section")]
        .filter((s) => s.querySelector(":scope ol.rail"));
      const chapterSlide = {};
      for (const slide of threads) {
        const items = [...slide.querySelectorAll("ol.rail li")];
        chapterSlide[items.findIndex((li) => li.classList.contains("now"))] = slide;
      }
      for (const slide of threads) {
        slide.querySelectorAll("ol.rail li").forEach((li, i) => {
          const target = chapterSlide[i];
          if (!target) return;
          li.classList.add("jump");
          li.addEventListener("click", () => {
            const { h, v } = Reveal.getIndices(target);
            const reveal = document.querySelector(".reveal");
            reveal.classList.add("rail-jump");
            Reveal.slide(h, v);
            requestAnimationFrame(() => requestAnimationFrame(() => reveal.classList.remove("rail-jump")));
          });
        });
      }
    });
  </script>
</body>

</html>
